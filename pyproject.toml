[project]
name = "edi-preflight"
version = "0.1.0"
description = "Free EDI tool — inbound 850 parser and outbound 856 validator for specialty food brands"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.7",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.24",
]
