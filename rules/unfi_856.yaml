# UNFI 856 ASN (Advance Ship Notice) — Spec Reference (Version 5010)
# United Natural Foods Inc — largest natural/organic food distributor.
# UNFI requires ASN for warehouse receiving but chargeback amounts are
# lower than big-box retailers.

retailer: unfi
document_type: "856"
version: "005010"

# --- Envelope requirements ---

envelope:
  gs_functional_id: SH
  st_transaction_type: "856"

# --- BSN ---

bsn:
  required: true
  elements:
    BSN01: { name: purpose_code, required: true, values: ["00"], description: "00=Original (UNFI rarely accepts replacements)" }
    BSN02: { name: shipment_id, required: true }
    BSN03: { name: date, required: true, format: CCYYMMDD }
    BSN04: { name: time, required: true, format: HHMM }

# --- HL loop structure ---
# UNFI uses standard S→O→T→P→I. Tare level is optional for some DCs
# but SSCC-18 (at the Pack/Tare container) is strongly recommended.

hl_loop:
  required: true
  levels:
    S:
      name: shipment
      code: "S"
      required: true
      parent: null
      child_segments:
        - segment: TD5
          required: true
          description: Carrier routing
        - segment: DTM
          required: true
          qualifiers:
            "011": shipped_date
        - segment: N1
          required: true
          entity_codes:
            ST: { name: ship_to, required: true }

    O:
      name: order
      code: "O"
      required: true
      parent: S
      child_segments:
        - segment: PRF
          required: true
          elements:
            PRF01: { name: po_number, required: true }

    T:
      name: tare
      code: "T"
      required: false
      parent: O
      description: Tare (pallet) level — optional for some UNFI DCs
      child_segments:
        - segment: MAN
          required: false
          description: SSCC-18 — recommended but not always enforced

    P:
      name: pack
      code: "P"
      required: true
      parent: O  # or T, when a pallet/tare level is present
      description: Pack (carton/case) — carries the SSCC-18
      child_segments:
        - segment: MAN
          required: false
          description: SSCC-18 — recommended but not always enforced

    I:
      name: item
      code: "I"
      required: true
      parent: P
      description: Item detail — shipped quantity per line
      child_segments:
        - segment: SN1
          required: true
        - segment: MEA
          required: false

# --- Chargeback fee schedule ---
# UNFI chargebacks are lower than Walmart/Costco. Missing ASN
# mainly delays receiving rather than triggering large fines.

chargebacks:
  missing_asn:
    fee: 150.00
    per: shipment
    severity: will-cause-chargeback
    description: ASN not received — causes receiving delays

  missing_sscc18:
    fee: 25.00
    per: case
    severity: may-cause-chargeback
    description: Missing SSCC-18 — may delay warehouse processing

  invalid_sscc18_format:
    fee: 25.00
    per: case
    severity: may-cause-chargeback
    description: SSCC-18 format error

  wrong_hl_hierarchy:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: HL loop hierarchy violation

  missing_catch_weight:
    fee: 50.00
    per: item
    severity: will-cause-chargeback
    description: Catch-weight item without weight measurement

  missing_po_reference:
    fee: 0.00
    per: order
    severity: blocks-transmission
    description: Missing PO reference at order level

  missing_ship_to:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship-to at shipment level

  missing_ship_date:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship date at shipment level

  missing_carrier:
    fee: 0.00
    per: document
    severity: may-cause-chargeback
    description: No carrier routing

severity_levels:
  blocks-transmission:
    order: 1
    label: Blocks Transmission
  will-cause-chargeback:
    order: 2
    label: Will Cause Chargeback
  may-cause-chargeback:
    order: 3
    label: May Cause Chargeback
  cosmetic:
    order: 4
    label: Cosmetic
