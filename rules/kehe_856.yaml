# KeHE 856 ASN (Advance Ship Notice) — Spec Reference (Version 5010)
# KeHE Distributors — specialty/natural food distributor.
# KeHE requires ASN but chargeback enforcement is moderate.

retailer: kehe
document_type: "856"
version: "005010"

# --- Envelope requirements ---

envelope:
  gs_functional_id: SH
  st_transaction_type: "856"

# --- BSN ---

bsn:
  required: true
  elements:
    BSN01: { name: purpose_code, required: true, values: ["00"] }
    BSN02: { name: shipment_id, required: true }
    BSN03: { name: date, required: true, format: CCYYMMDD }
    BSN04: { name: time, required: true, format: HHMM }

# --- HL loop structure ---
# KeHE uses standard S→O→I→P. SSCC-18 required at tare level.

hl_loop:
  required: true
  levels:
    S:
      name: shipment
      code: "S"
      required: true
      parent: null
      child_segments:
        - segment: TD5
          required: true
        - segment: DTM
          required: true
          qualifiers:
            "011": shipped_date
        - segment: N1
          required: true
          entity_codes:
            ST: { name: ship_to, required: true }

    O:
      name: order
      code: "O"
      required: true
      parent: S
      child_segments:
        - segment: PRF
          required: true

    I:
      name: tare
      code: "I"
      required: true
      parent: O
      child_segments:
        - segment: MAN
          required: true

    P:
      name: pack
      code: "P"
      required: false
      parent: I
      child_segments:
        - segment: SN1
          required: true
        - segment: MEA
          required: false

# --- Chargeback fee schedule ---
# KeHE chargebacks are moderate. Main concern is receiving accuracy.

chargebacks:
  missing_asn:
    fee: 200.00
    per: shipment
    severity: will-cause-chargeback
    description: ASN not received before delivery

  missing_sscc18:
    fee: 75.00
    per: case
    severity: will-cause-chargeback
    description: Missing SSCC-18 barcode

  invalid_sscc18_format:
    fee: 75.00
    per: case
    severity: will-cause-chargeback
    description: SSCC-18 format or check digit error

  wrong_hl_hierarchy:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: HL loop hierarchy violation

  missing_catch_weight:
    fee: 75.00
    per: item
    severity: will-cause-chargeback
    description: Catch-weight item without MEA*WT

  missing_po_reference:
    fee: 0.00
    per: order
    severity: blocks-transmission
    description: Missing PO reference

  missing_ship_to:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship-to at shipment level

  missing_ship_date:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship date at shipment level

  missing_carrier:
    fee: 0.00
    per: document
    severity: may-cause-chargeback
    description: No carrier routing

severity_levels:
  blocks-transmission:
    order: 1
    label: Blocks Transmission
    color: "#c0392b"
  will-cause-chargeback:
    order: 2
    label: Will Cause Chargeback
    color: "#e67e22"
  may-cause-chargeback:
    order: 3
    label: May Cause Chargeback
    color: "#f1c40f"
  cosmetic:
    order: 4
    label: Cosmetic
    color: "#95a5a6"
