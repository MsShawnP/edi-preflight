# Costco 856 ASN (Advance Ship Notice) — Spec Reference (Version 5010)
# Costco Wholesale Corporation. Costco has strict OTIF (On-Time In-Full)
# requirements with significant chargebacks for non-compliance.

retailer: costco
document_type: "856"
version: "005010"

# --- Envelope requirements ---

envelope:
  gs_functional_id: SH
  st_transaction_type: "856"

# --- BSN ---

bsn:
  required: true
  elements:
    BSN01: { name: purpose_code, required: true, values: ["00"] }
    BSN02: { name: shipment_id, required: true }
    BSN03: { name: date, required: true, format: CCYYMMDD }
    BSN04: { name: time, required: true, format: HHMM }

# --- HL loop structure ---
# Costco uses standard S→O→I→P. All levels enforced.
# SSCC-18 is mandatory. Catch-weight enforcement is strict.

hl_loop:
  required: true
  levels:
    S:
      name: shipment
      code: "S"
      required: true
      parent: null
      child_segments:
        - segment: TD5
          required: true
          description: Carrier routing — Costco requires SCAC
        - segment: DTM
          required: true
          qualifiers:
            "011": shipped_date
            "017": estimated_delivery_date
        - segment: N1
          required: true
          entity_codes:
            SF: { name: ship_from, required: true }
            ST: { name: ship_to, required: true }

    O:
      name: order
      code: "O"
      required: true
      parent: S
      child_segments:
        - segment: PRF
          required: true

    I:
      name: tare
      code: "I"
      required: true
      parent: O
      child_segments:
        - segment: MAN
          required: true
          description: SSCC-18 mandatory on all pallets

    P:
      name: pack
      code: "P"
      required: false
      parent: I
      child_segments:
        - segment: SN1
          required: true
        - segment: LIN
          required: false
        - segment: MEA
          required: false

# --- Chargeback fee schedule (Costco Vendor Compliance) ---
# Costco chargebacks are among the highest in retail.

chargebacks:
  missing_asn:
    fee: 500.00
    per: load
    severity: blocks-transmission
    description: No ASN received before delivery

  missing_sscc18:
    fee: 150.00
    per: pallet
    severity: will-cause-chargeback
    description: Missing SSCC-18 barcode on pallet

  invalid_sscc18_format:
    fee: 150.00
    per: pallet
    severity: will-cause-chargeback
    description: Invalid SSCC-18 format or check digit

  wrong_hl_hierarchy:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: HL loop hierarchy violation

  missing_catch_weight:
    fee: 150.00
    per: item
    severity: will-cause-chargeback
    description: Catch-weight item without MEA*WT

  missing_po_reference:
    fee: 0.00
    per: order
    severity: blocks-transmission
    description: Missing PO reference at order level

  missing_ship_to:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship-to at shipment level

  missing_ship_date:
    fee: 0.00
    per: document
    severity: blocks-transmission
    description: No ship date at shipment level

  missing_carrier:
    fee: 0.00
    per: document
    severity: may-cause-chargeback
    description: No carrier routing at shipment level

severity_levels:
  blocks-transmission:
    order: 1
    label: Blocks Transmission
    color: "#c0392b"
  will-cause-chargeback:
    order: 2
    label: Will Cause Chargeback
    color: "#e67e22"
  may-cause-chargeback:
    order: 3
    label: May Cause Chargeback
    color: "#f1c40f"
  cosmetic:
    order: 4
    label: Cosmetic
    color: "#95a5a6"
