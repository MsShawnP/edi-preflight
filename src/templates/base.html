<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDI Pre-flight{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">EDI Pre-flight</a></h1>
            <p class="tagline">Parse inbound 850s and validate outbound 856s</p>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container">
            <p>Your documents are not stored. All processing happens in memory and is discarded after your session.</p>
        </div>
    </footer>
</body>
</html>
